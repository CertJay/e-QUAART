# Local / on-premise deployment. Put TLS in front of the `web` service (reverse proxy or
# a certificate-terminating load balancer) and set COOKIE_SECURE=true.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: equaart
      POSTGRES_USER: equaart
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equaart"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: server/Dockerfile }
    environment:
      DATABASE_URL: postgresql://equaart:${DB_PASSWORD}@db:5432/equaart
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (48+ random characters)}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: client/Dockerfile }
    ports:
      - "8080:80"
    depends_on: [api]
    restart: unless-stopped

volumes:
  db-data:
