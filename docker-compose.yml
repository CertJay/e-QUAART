# Optional. On a laptop without Docker, use `npm run setup` and `npm start` instead (see README).
services:
  app:
    build: { context: ., dockerfile: server/Dockerfile }
    environment:
      DATABASE_URL: file:/data/equaart.db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (48+ random characters)}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:4000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - data:/data
    ports:
      - "4000:4000"
    restart: unless-stopped

volumes:
  data:
