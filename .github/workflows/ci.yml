name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: equaart
          POSTGRES_PASSWORD: equaart
          POSTGRES_DB: equaart_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U equaart" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://equaart:equaart@localhost:5432/equaart_test
      DATABASE_URL: postgresql://equaart:equaart@localhost:5432/equaart_test
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate --schema server/prisma/schema.prisma
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
